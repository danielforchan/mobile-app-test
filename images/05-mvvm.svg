<svg xmlns="http://www.w3.org/2000/svg" width="910" height="555" viewBox="0 0 910 555" font-family="Arial, sans-serif"><defs><marker id="av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#558B2F"/></marker><marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E65100"/></marker><marker id="am" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="avm" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6A1B9A"/></marker><marker id="ai" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#00838F"/></marker><marker id="au" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#455A64"/></marker><marker id="as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#AD1457"/></marker><marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="910" height="555" fill="#fff"/><text x="20" y="32" font-size="20" font-weight="bold" fill="#222">MVVM – Model · View · ViewModel (reactive)</text><text x="20" y="54" font-size="13" fill="#666">View observes LiveData in the ViewModel; the ViewModel does not know the View</text><rect x="60" y="90" width="250" height="110" rx="12" fill="#558B2F"/><text x="185.0" y="118" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">View</text><text x="185.0" y="140" font-size="12" fill="#fff" text-anchor="middle">Activity / Fragment</text><text x="185.0" y="157" font-size="12" fill="#fff" text-anchor="middle">observe(LiveData)</text><text x="185.0" y="174" font-size="12" fill="#fff" text-anchor="middle">forward clicks to ViewModel</text><rect x="440" y="90" width="260" height="130" rx="12" fill="#6A1B9A"/><text x="570.0" y="118" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">ViewModel</text><text x="570.0" y="140" font-size="12" fill="#fff" text-anchor="middle">UserViewModel extends ViewModel</text><text x="570.0" y="157" font-size="12" fill="#fff" text-anchor="middle">private MutableLiveData&lt;User&gt;</text><text x="570.0" y="174" font-size="12" fill="#fff" text-anchor="middle">public LiveData&lt;User&gt; getUser()</text><text x="570.0" y="191" font-size="12" fill="#fff" text-anchor="middle">survives rotation</text><rect x="440" y="330" width="260" height="90" rx="12" fill="#1565C0"/><text x="570.0" y="358" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">Model</text><text x="570.0" y="380" font-size="12" fill="#fff" text-anchor="middle">UserModel / Repository</text><text x="570.0" y="397" font-size="12" fill="#fff" text-anchor="middle">Room · network · prefs</text><polyline points="312,120 438,120" fill="none" stroke="#558B2F" stroke-width="2.2" marker-end="url(#av)" /><text x="375" y="96" font-size="12.5" fill="#558B2F" text-anchor="middle" font-family="monospace">1) vm.load</text><text x="375" y="111" font-size="12.5" fill="#558B2F" text-anchor="middle" font-family="monospace">UserInfo()</text><polyline points="600,222 600,328" fill="none" stroke="#6A1B9A" stroke-width="2.2" marker-end="url(#avm)" /><text x="610" y="280" font-size="12.5" fill="#6A1B9A" text-anchor="start" font-family="monospace">2) fetch</text><polyline points="540,328 540,222" fill="none" stroke="#1565C0" stroke-width="2.2" marker-end="url(#am)" /><text x="480" y="280" font-size="12.5" fill="#1565C0" text-anchor="start" font-family="monospace">3) data</text><polyline points="438,185 312,185" fill="none" stroke="#6A1B9A" stroke-width="2.2" marker-end="url(#avm)" stroke-dasharray="6,4"/><text x="375" y="205" font-size="12.5" fill="#6A1B9A" text-anchor="middle" font-family="monospace">4) setValue()</text><text x="375" y="220" font-size="12.5" fill="#6A1B9A" text-anchor="middle" font-family="monospace">LiveData notifies</text><rect x="730" y="90" width="150" height="130" rx="10" fill="#F3E5F5" stroke="#6A1B9A"/><text x="742" y="115" font-size="12" fill="#6A1B9A">LiveData = observable</text><text x="742" y="133" font-size="12" fill="#6A1B9A">View = observer</text><text x="742" y="151" font-size="12" fill="#6A1B9A"></text><text x="742" y="169" font-size="12" fill="#6A1B9A">setValue() main thread</text><text x="742" y="187" font-size="12" fill="#6A1B9A">postValue() bg thread</text><text x="60" y="465" font-size="12.5" fill="#333">• View REACTS to data changes (reactive / observer pattern), ViewModel never references the View.</text><text x="60" y="483" font-size="12.5" fill="#333">• Expose LiveData (read-only); keep MutableLiveData private.</text><text x="60" y="501" font-size="12.5" fill="#333">• observe(this, ...) is lifecycle-aware: no updates when the Activity is stopped, auto-removed on destroy.</text><text x="60" y="519" font-size="12.5" fill="#333">• ViewModel lives until the Activity really finishes → onCleared(). Rotation keeps the data.</text></svg>