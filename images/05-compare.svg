<svg xmlns="http://www.w3.org/2000/svg" width="890" height="370" viewBox="0 0 890 370" font-family="Arial, sans-serif"><defs><marker id="av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#558B2F"/></marker><marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E65100"/></marker><marker id="am" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="avm" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6A1B9A"/></marker><marker id="ai" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#00838F"/></marker><marker id="au" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#455A64"/></marker><marker id="as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#AD1457"/></marker><marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="890" height="370" fill="#fff"/><text x="20" y="32" font-size="20" font-weight="bold" fill="#222">Same button click in MVP vs MVVM vs MVI</text><rect x="20" y="70" width="270" height="280" rx="14" fill="#FAFAFA" stroke="#E65100" stroke-width="2"/><text x="155" y="100" font-size="18" font-weight="bold" fill="#E65100" text-anchor="middle">MVP</text><text x="38" y="132" font-size="13" fill="#333" font-family="monospace">click</text><text x="38" y="158" font-size="13" fill="#558B2F" font-family="monospace"> → presenter.onX()</text><text x="38" y="184" font-size="13" fill="#E65100" font-family="monospace"> → model.getData()</text><text x="38" y="210" font-size="13" fill="#E65100" font-family="monospace"> → view.showX(data)</text><text x="38" y="236" font-size="13" fill="#333" font-family="monospace"></text><text x="38" y="262" font-size="13" fill="#333" font-family="monospace">View knows Presenter</text><text x="38" y="288" font-size="13" fill="#333" font-family="monospace">Presenter knows View</text><text x="38" y="314" font-size="13" fill="#E65100" font-family="monospace">UI update: IMPERATIVE</text><rect x="310" y="70" width="270" height="280" rx="14" fill="#FAFAFA" stroke="#6A1B9A" stroke-width="2"/><text x="445" y="100" font-size="18" font-weight="bold" fill="#6A1B9A" text-anchor="middle">MVVM</text><text x="328" y="132" font-size="13" fill="#333" font-family="monospace">click</text><text x="328" y="158" font-size="13" fill="#558B2F" font-family="monospace"> → vm.onX()</text><text x="328" y="184" font-size="13" fill="#6A1B9A" font-family="monospace"> → model.getData()</text><text x="328" y="210" font-size="13" fill="#6A1B9A" font-family="monospace"> → live.setValue(d)</text><text x="328" y="236" font-size="13" fill="#558B2F" font-family="monospace"> → observer updates UI</text><text x="328" y="262" font-size="13" fill="#333" font-family="monospace">View knows ViewModel</text><text x="328" y="288" font-size="13" fill="#333" font-family="monospace">VM does NOT know View</text><text x="328" y="314" font-size="13" fill="#6A1B9A" font-family="monospace">UI update: REACTIVE</text><rect x="600" y="70" width="270" height="280" rx="14" fill="#FAFAFA" stroke="#00838F" stroke-width="2"/><text x="735" y="100" font-size="18" font-weight="bold" fill="#00838F" text-anchor="middle">MVI</text><text x="618" y="132" font-size="13" fill="#333" font-family="monospace">click</text><text x="618" y="158" font-size="13" fill="#558B2F" font-family="monospace"> → vm.process(Intent)</text><text x="618" y="184" font-size="13" fill="#00838F" font-family="monospace"> → reduce(old, intent)</text><text x="618" y="210" font-size="13" fill="#00838F" font-family="monospace"> → state.setValue(new)</text><text x="618" y="236" font-size="13" fill="#558B2F" font-family="monospace"> → render(state)</text><text x="618" y="262" font-size="13" fill="#333" font-family="monospace">ONE State object</text><text x="618" y="288" font-size="13" fill="#333" font-family="monospace">immutable, new each time</text><text x="618" y="314" font-size="13" fill="#00838F" font-family="monospace">UI update: UDF</text></svg>