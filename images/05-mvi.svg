<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" font-family="Arial, sans-serif"><defs><marker id="av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#558B2F"/></marker><marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E65100"/></marker><marker id="am" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="avm" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6A1B9A"/></marker><marker id="ai" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#00838F"/></marker><marker id="au" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#455A64"/></marker><marker id="as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#AD1457"/></marker><marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="900" height="590" fill="#fff"/><text x="20" y="32" font-size="20" font-weight="bold" fill="#222">MVI – Model · View · Intent (unidirectional)</text><text x="20" y="54" font-size="13" fill="#666">User actions become Intents; the Model returns a new immutable State</text><rect x="350" y="80" width="220" height="90" rx="12" fill="#1565C0"/><text x="460.0" y="108" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">Model</text><text x="460.0" y="130" font-size="12" fill="#fff" text-anchor="middle">ViewModel.process(intent)</text><text x="460.0" y="147" font-size="12" fill="#fff" text-anchor="middle">reduce → NEW State</text><rect x="70" y="230" width="200" height="90" rx="12" fill="#558B2F"/><text x="170.0" y="258" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">View</text><text x="170.0" y="280" font-size="12" fill="#fff" text-anchor="middle">render(state)</text><rect x="650" y="230" width="200" height="90" rx="12" fill="#00838F"/><text x="750.0" y="258" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">Intent</text><text x="750.0" y="280" font-size="12" fill="#fff" text-anchor="middle">LoadUser · Increment</text><text x="750.0" y="297" font-size="12" fill="#fff" text-anchor="middle">Reset … (user actions)</text><rect x="350" y="380" width="220" height="80" rx="12" fill="#455A64"/><text x="460.0" y="408" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">User</text><text x="460.0" y="430" font-size="12" fill="#fff" text-anchor="middle">taps / types</text><polyline points="348,125 170,125 170,228" fill="none" stroke="#1565C0" stroke-width="2.2" marker-end="url(#am)" /><text x="180" y="115" font-size="12.5" fill="#1565C0" text-anchor="start" font-family="monospace">4) emit State (LiveData)</text><polyline points="170,322 170,420 348,420" fill="none" stroke="#558B2F" stroke-width="2.2" marker-end="url(#av)" /><text x="180" y="445" font-size="12.5" fill="#558B2F" text-anchor="start" font-family="monospace">5) display(State)</text><polyline points="572,420 750,420 750,322" fill="none" stroke="#455A64" stroke-width="2.2" marker-end="url(#au)" /><text x="600" y="445" font-size="12.5" fill="#455A64" text-anchor="start" font-family="monospace">1) action</text><polyline points="750,228 750,125 572,125" fill="none" stroke="#00838F" stroke-width="2.2" marker-end="url(#ai)" /><text x="600" y="115" font-size="12.5" fill="#00838F" text-anchor="start" font-family="monospace">2) process(Intent)</text><text x="460" y="305" font-size="13" fill="#999" text-anchor="middle">one direction only</text><rect x="300" y="200" width="320" height="0" /><text x="70" y="505" font-size="12.5" fill="#333">• Unidirectional Data Flow: View → Intent → Model → State → View.</text><text x="70" y="523" font-size="12.5" fill="#333">• State is IMMUTABLE and is the Single Source of Truth (e.g. loading / user / error in ONE object).</text><text x="70" y="541" font-size="12.5" fill="#333">• Every change = create a NEW State object; View redraws everything from render(state).</text><text x="70" y="559" font-size="12.5" fill="#333">• Pros: predictable, consistent, easy to test.  Cons: more classes (Intent + State) = more boilerplate.</text></svg>