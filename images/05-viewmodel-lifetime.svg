</text><text x="420" y="286" font-size="13" fill="#333"></text><text x="420" y="304" font-size="13" fill="#333">… but ViewModel survives →</text><text x="420" y="322" font-size="13" fill="#333">count / user data NOT lost.</text><text x="420" y="340" font-size="13" fill="#333"></text><text x="420" y="358" font-size="13" fill="#333">Only cleared when the Activity</text><text x="420" y="376" font-size="13" fill="#333">really finishes (Back / finish()).</text></svg>