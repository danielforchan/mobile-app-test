<svg xmlns="http://www.w3.org/2000/svg" width="900" height="530" viewBox="0 0 900 530" font-family="Arial, sans-serif"><defs><marker id="av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#558B2F"/></marker><marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E65100"/></marker><marker id="am" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="avm" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6A1B9A"/></marker><marker id="ai" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#00838F"/></marker><marker id="au" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#455A64"/></marker><marker id="as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#AD1457"/></marker><marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="900" height="530" fill="#fff"/><text x="20" y="32" font-size="20" font-weight="bold" fill="#222">MVP – Model · View · Presenter (imperative)</text><text x="20" y="54" font-size="13" fill="#666">Presenter tells the View exactly what to display</text><rect x="330" y="80" width="220" height="90" rx="12" fill="#E65100"/><text x="440.0" y="108" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">Presenter</text><text x="440.0" y="130" font-size="12" fill="#fff" text-anchor="middle">UserPresenter</text><text x="440.0" y="147" font-size="12" fill="#fff" text-anchor="middle">holds refs to View + Model</text><text x="440.0" y="164" font-size="12" fill="#fff" text-anchor="middle">all logic here</text><rect x="60" y="300" width="230" height="90" rx="12" fill="#1565C0"/><text x="175.0" y="328" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">Model</text><text x="175.0" y="350" font-size="12" fill="#fff" text-anchor="middle">UserModel / User</text><text x="175.0" y="367" font-size="12" fill="#fff" text-anchor="middle">data + business logic</text><text x="175.0" y="384" font-size="12" fill="#fff" text-anchor="middle">(DB / network)</text><rect x="590" y="300" width="230" height="90" rx="12" fill="#558B2F"/><text x="705.0" y="328" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">View</text><text x="705.0" y="350" font-size="12" fill="#fff" text-anchor="middle">Activity implements</text><text x="705.0" y="367" font-size="12" fill="#fff" text-anchor="middle">UserView interface</text><text x="705.0" y="384" font-size="12" fill="#fff" text-anchor="middle">shows data, forwards clicks</text><polyline points="705,300 705,125 552,125" fill="none" stroke="#558B2F" stroke-width="2.2" marker-end="url(#av)" /><text x="712" y="200" font-size="12.5" fill="#558B2F" text-anchor="start" font-family="monospace">1) user action</text><text x="712" y="215" font-size="12.5" fill="#558B2F" text-anchor="start" font-family="monospace">presenter</text><text x="712" y="230" font-size="12.5" fill="#558B2F" text-anchor="start" font-family="monospace">.loadUserInfo()</text><polyline points="400,172 400,240 200,240 200,298" fill="none" stroke="#E65100" stroke-width="2.2" marker-end="url(#ap)" /><text x="210" y="262" font-size="12.5" fill="#E65100" text-anchor="start" font-family="monospace">2) ask data</text><text x="210" y="277" font-size="12.5" fill="#E65100" text-anchor="start" font-family="monospace">model.fetchUserInfo()</text><polyline points="140,298 140,125 328,125" fill="none" stroke="#1565C0" stroke-width="2.2" marker-end="url(#am)" /><text x="30" y="215" font-size="12.5" fill="#1565C0" text-anchor="start" font-family="monospace">3) returns User</text><polyline points="480,172 480,240 650,240 650,298" fill="none" stroke="#E65100" stroke-width="2.2" marker-end="url(#ap)" /><text x="490" y="262" font-size="12.5" fill="#E65100" text-anchor="start" font-family="monospace">4) update UI (imperative)</text><text x="490" y="277" font-size="12.5" fill="#E65100" text-anchor="start" font-family="monospace">view.showUserInfo(n, e)</text><text x="60" y="440" font-size="12.5" fill="#333">• View is PASSIVE: it never decides what to show, it only implements showXxx() methods.</text><text x="60" y="458" font-size="12.5" fill="#333">• Presenter calls View directly → two-way link View &lt;-&gt; Presenter (needs interface, watch memory leaks).</text><text x="60" y="476" font-size="12.5" fill="#333">• Presenter has NO Android UI code (no TextView, no findViewById) → easy to unit test.</text><text x="60" y="494" font-size="12.5" fill="#333">• Rotation: Presenter is recreated with the Activity (state NOT kept automatically).</text></svg>